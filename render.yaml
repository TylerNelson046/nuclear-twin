services:
  - type: web
    name: nuclear-twin
    runtime: python
    plan: free
    buildCommand: pip install poetry==2.4.1 && poetry install --only main --no-root --no-interaction
    startCommand: poetry run gunicorn app:server --config gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
